# Render Blueprint for a Docker web service.
# Not yet deployed or verified; see "Deployment" in README.md.
services:
  - type: web
    name: ai-link-analysis
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: ENVIRONMENT
        value: production
      # Secrets are entered in the Render dashboard, never stored in the repository.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
